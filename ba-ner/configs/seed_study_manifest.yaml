methodology:
  primary_description: All five fine-tuned model groups are trained fresh with Seeds 42, 123, and 456 under one frozen managed contract. The checkpoint with the highest validation F1 is selected for test evaluation.
  historical_policy: All pre-study Seed-42 outputs are preserved read-only and excluded from primary seed aggregates.
  qwen27b_2ep_policy: The original two-epoch run is preserved and is never resumed into the canonical three-epoch setup.
  continued_training_policy: Extending the two-epoch cosine schedule would be a separate continued-training ablation and is outside the primary study.
