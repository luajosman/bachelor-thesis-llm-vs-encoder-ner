experiment_name: qwen35-4b-qlora-canonical-seed456
model_name: Qwen/Qwen3.5-4B
model_type: decoder
mode: lora
dataset: multinerd
dataset_language: en
use_qlora: true
attn_impl: sdpa
lora_r: 16
lora_alpha: 32
lora_dropout: 0.05
target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]
num_train_epochs: 3
learning_rate: 2e-4
per_device_train_batch_size: 4
per_device_eval_batch_size: 4
gradient_accumulation_steps: 4
warmup_ratio: 0.05
lr_scheduler_type: cosine
weight_decay: 0.01
gradient_checkpointing: true
packing: false
max_seq_length: 1024
eval_strategy: epoch
save_strategy: steps
save_steps: 500
save_total_limit: 2
gen_eval_max_samples: 200
logging_steps: 25
use_wandb: false
seed: 456
output_dir: results/multinerd/qwen35-4b-qlora-canonical-seed456
