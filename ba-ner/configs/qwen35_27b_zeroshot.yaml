# Qwen3.5-27B — Zero-Shot Baseline (kein Training)
# Hauptbenchmark: MultiNERD (englisch)
#
# Hinweis: BF16 inference needs an approximately 54 GB model allocation and is
# therefore assigned to an H100 NVL with 96 GB VRAM.

experiment_name: qwen35-27b-zeroshot
model_name: Qwen/Qwen3.5-27B
model_type: decoder
mode: zeroshot

# Datensatz
dataset: multinerd
dataset_language: en

# BF16 keeps inference precision consistent across all three zero-shot Qwen
# models and avoids the measured bitsandbytes generation overhead.
use_qlora: false
attn_impl: sdpa

# Generierung
max_new_tokens: 256
inference_batch_size: 1
checkpoint_sync_interval: 100

# Reproduzierbarkeit
seed: 42

# Ausgabe
output_dir: results/multinerd/qwen35-27b-zeroshot
