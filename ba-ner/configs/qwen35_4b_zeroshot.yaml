# Qwen3.5-4B — Zero-Shot Baseline (kein Training)
# Hauptbenchmark: MultiNERD (englisch)

experiment_name: qwen35-4b-zeroshot
model_name: Qwen/Qwen3.5-4B
model_type: decoder
mode: zeroshot

# Datensatz
dataset: multinerd
dataset_language: en

# BF16 avoids the large bitsandbytes dequantization overhead observed in the
# 0.8B benchmark and fits comfortably on the assigned A100 80 GB.
use_qlora: false
attn_impl: sdpa

# Generierung — greedy/deterministisch fuer Reproduzierbarkeit
max_new_tokens: 256
inference_batch_size: 1
checkpoint_sync_interval: 100

# Reproduzierbarkeit
seed: 42

# Ausgabe
output_dir: results/multinerd/qwen35-4b-zeroshot
