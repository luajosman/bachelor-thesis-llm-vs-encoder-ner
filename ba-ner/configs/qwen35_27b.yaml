# Qwen3.5-27B — Grosses LLM mit QLoRA fuer NER
# Hauptbenchmark: MultiNERD (englisch)
#
# Hinweis: Benoetig mindestens ~24 GB VRAM mit QLoRA.
# Fuer bf16 LoRA (use_qlora: false) werden ~80 GB VRAM benoetigt (A100).

experiment_name: qwen35-27b-qlora
model_name: Qwen/Qwen3.5-27B
model_type: decoder
mode: lora

# Datensatz
dataset: multinerd
dataset_language: en

# Quantisierung & Attention
use_qlora: true
attn_impl: sdpa    # sdpa fuer Qwen3.5 (NICHT flash_attention_2)

# LoRA-Konfiguration — hoeherer Rang fuer groesseres Modell
lora_r: 32
lora_alpha: 64
lora_dropout: 0.05
target_modules:
  - q_proj
  - k_proj
  - v_proj
  - o_proj
  - gate_proj
  - up_proj
  - down_proj

# Training — konservativere Settings wegen Modellgroesse
num_train_epochs: 2
learning_rate: 1e-4
per_device_train_batch_size: 1
per_device_eval_batch_size: 1
gradient_accumulation_steps: 16
warmup_ratio: 0.03
lr_scheduler_type: cosine
weight_decay: 0.01

# Effizienz
gradient_checkpointing: true
packing: false
max_seq_length: 1024

# Evaluation & Checkpointing
eval_strategy: epoch
save_strategy: steps
save_steps: 500
save_total_limit: 2

# Generative Dev-Evaluation: Anzahl Samples pro Epoche
gen_eval_max_samples: 200

# Logging
logging_steps: 25
use_wandb: false

# Reproduzierbarkeit
seed: 42

# Ausgabe
output_dir: results/multinerd/qwen35-27b-qlora
